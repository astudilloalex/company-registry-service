components:
  parameters:
    TenantId:
      name: Tenant-Id
      in: header
      required: true
      description: Exactly one canonical UUID. Trusted caller context, not an authorization decision. UUID hexadecimal
        letters must be lowercase; uppercase, whitespace and abbreviated forms are rejected without normalization.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: 018f1234-5678-7000-8000-000000000001
    UserId:
      name: User-Id
      in: header
      required: true
      description: Exactly one nonblank actor, at most 128 code points, without control characters; preserved unchanged.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: Actor-aB
    ProcessId:
      name: Process-Id
      in: header
      required: true
      description: Exactly one canonical UUID, validated first and preserved exactly in downstream context and responses,
        including subsequent failures. UUID hexadecimal letters must be lowercase; uppercase, whitespace and abbreviated
        forms are rejected without normalization.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: 018f1234-5678-7000-8000-000000000002
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one nonblank opaque key of at most 128 code points, preserved exactly. Required for registration
        and replay. Tenant/operation/key identifies an acceptance. Equivalent canonical input replays the original
        enriched 201 snapshot without provider access or writes. Different effective input returns 409. Fingerprints
        use the stored policy and historical HMAC key.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: Key-aB
    ExpectedVersion:
      name: If-Match
      in: header
      required: true
      description: Internal Party-compatible decimal expected aggregate version, not an HTTP entity-tag. Canonical
        nonnegative int64 decimal, no quotes/wildcard/leading zeros. Company mutations use Company.version; Site/Address/Contact
        mutations use Site.version. Missing/invalid is 400; stale is 412. Read operations do not require mutation
        headers.
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
        maxLength: 19
      example: '0'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Authenticated versioned cursor bound to tenant, effective exact filters and created_at DESC,
        id DESC order. Invalid/incompatible cursors and unknown/repeated query parameters are 400. Forward navigation;
        no frozen snapshot. Limit may change between pages.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    UpdateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional durable update intent key. One nonblank opaque value up to 128 code points, preserved
        exactly. Repeat original body and If-Match for replay.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: Key-aB
  headers:
    ProcessId:
      description: Exactly the validated request Process-Id. Omitted when that input is missing/invalid.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  schemas:
    EmptyCompanyCommand:
      type: object
      additionalProperties: false
      description: Absent body and {} are equivalent empty intent. Reject null, nonobjects, any properties, malformed
        JSON and trailing tokens before replay.
    CompanyLifecycleErrorResponse:
      type: object
      required:
      - status
      - code
      additionalProperties: false
      properties:
        status:
          type: integer
          enum:
          - 400
          - 404
          - 409
          - 412
          - 415
          - 500
          - 502
          - 503
        code:
          type: string
          enum:
          - process-id-invalid
          - tenant-id-invalid
          - user-id-invalid
          - if-match-required
          - if-match-duplicated
          - if-match-invalid
          - company-id-invalid
          - idempotency-key-duplicated
          - idempotency-key-blank
          - idempotency-key-too-long
          - request-body-invalid-json
          - request-body-must-be-object
          - request-body-contains-unknown-fields
          - company-not-found
          - party-reference-not-found
          - company-archived
          - company-already-in-requested-state
          - company-transition-not-allowed
          - legal-headquarters-required
          - active-headquarters-required
          - party-must-be-legal-entity
          - party-must-be-active
          - idempotency-key-already-used-with-different-request
          - aggregate-version-mismatch
          - unsupported-media-type
          - server-error
          - dependency-response-invalid
          - dependency-unavailable
    UpdateSiteRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Required nonblank business text. Strip and uppercase before enforcing
            the 64 Unicode code point limit; the raw input may contain surrounding whitespace.
        name:
          type: string
          minLength: 1
          description: Required nonblank business text. Strip and uppercase before enforcing
            the 200 Unicode code point limit; the raw input may contain surrounding whitespace.
        siteType:
          type: string
          enum:
          - HEADQUARTERS
          - BRANCH
          - WAREHOUSE
          - OTHER
      additionalProperties: false
      description: Partial information. Omission preserves; explicit null rejected. Canonical
        equality and {} are no-op only with current Site version and editable states.
    EmptySiteCommand:
      type: object
      additionalProperties: false
      description: 'Optional body: absence or {} only. Consume entire document; any properties
        or trailing tokens are rejected.'
    SiteMutationErrorResponse:
      type: object
      required:
      - status
      - code
      additionalProperties: false
      properties:
        status:
          type: integer
          enum:
          - 400
          - 404
          - 409
          - 500
          - 503
          - 412
          - 415
        code:
          type: string
