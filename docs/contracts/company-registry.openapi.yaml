openapi: 3.1.0
info:
  title: Company Registry Service
  version: 1.0.0
  description: HU01 Company registration, durable replay and current enriched retrieval. All business routes require
    canonical lowercase UUID context. Health and OpenAPI retain management contracts without business headers. Verification
    routes are excluded.
paths:
  /v1/companies:
    post:
      operationId: registerCompany
      summary: Register Company or replay the original acceptance
      description: Only tenant-scoped LEGAL_ENTITY Party in DRAFT/ACTIVE/INACTIVE can create a DRAFT/version 0 Company.
        Company, completion and enabled outbox commit atomically. Replay does not consult providers. No If-Match
        required.
      parameters:
      - &id001
        $ref: '#/components/parameters/TenantId'
      - &id002
        $ref: '#/components/parameters/UserId'
      - &id003
        $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
            example:
              partyId: 018f1234-5678-7000-8000-000000000004
              code: acme
              operatingName: Compañía Ágil
              logoUrl: https://example.com/LogoAcme.png
      responses:
        '201':
          description: Accepted original snapshot.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnvelope'
              examples:
                CompanySuccess:
                  $ref: '#/components/examples/CompanySuccess'
        '400': &id004
          $ref: '#/components/responses/BadRequest'
        '500': &id005
          $ref: '#/components/responses/ServerError'
        '502': &id006
          $ref: '#/components/responses/DependencyInvalid'
        '503': &id007
          $ref: '#/components/responses/DependencyUnavailable'
        '404':
          $ref: '#/components/responses/ReferenceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listCompanies
      summary: List current Companies within the tenant
      description: Exact filters combine with AND. Unknown, repeated, blank or invalid parameters are rejected.
        Empty lists perform no Party calls. Identifiers include the complete historical collection of all provider
        states. Reads require no mutation headers.
      parameters:
      - *id001
      - *id002
      - *id003
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: code
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: Exact canonical business code.
      - name: partyId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          - ARCHIVED
      responses:
        '200':
          description: Current fully enriched representation. No partial response.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyCollectionEnvelope'
              examples:
                EmptyCollection:
                  $ref: '#/components/examples/EmptyCollection'
                CompanyCollection:
                  $ref: '#/components/examples/CompanyCollection'
        '400': *id004
        '500': *id005
        '502': *id006
        '503': *id007
  /v1/companies/{companyId}:
    get:
      operationId: getCompany
      summary: Get current Company within the tenant
      parameters:
      - *id001
      - *id002
      - *id003
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current fully enriched representation. No partial response.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnvelope'
              examples:
                CompanyRead:
                  $ref: '#/components/examples/CompanyRead'
        '400': *id004
        '500': *id005
        '502': *id006
        '503': *id007
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCompanyInformation
      summary: Patch operational Company information locally
      description: Replay precedes current existence/version/state. New operations check tenant ownership (404),
        version (412), then ARCHIVED (409). Editable DRAFT/ACTIVE/INACTIVE retain state. No-op preserves version/audit
        and emits no event. Effective change increments once and commits atomically with optional completion and
        enabled event.
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/UpdateIdempotencyKey'
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
            examples:
              Modify:
                value:
                  operatingName: COMPAÑÍA ÁGIL
              Clear:
                value:
                  description: null
                  logoUrl: null
              Noop:
                value: {}
              Replay:
                summary: Repeat original body with original precondition and key after later edits
                value:
                  operatingName: COMPAÑÍA ÁGIL
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/AggregateVersionMismatch'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '200':
          description: Accepted modification, no-op or original historical replay; no external calls.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyOperationalEnvelope'
  /v1/companies/{companyId}/sites:
    post:
      operationId: registerCompanySite
      summary: Register Site or replay the original local acceptance
      description: No If-Match. Company is protected before every new Site creation; ARCHIVED rejects new registration.
        Replay retains the original DRAFT/version 0/false result. No provider calls.
      parameters:
      - &id008
        $ref: '#/components/parameters/TenantId'
      - &id009
        $ref: '#/components/parameters/UserId'
      - &id010
        $ref: '#/components/parameters/ProcessId'
      - &id011
        name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
            example:
              code: sede
              name: Compañía Ágil
              siteType: BRANCH
      responses:
        '201':
          description: Original accepted Site; replay also returns 201.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteEnvelope'
              example:
                status: 201
                code: successful
                data:
                  siteId: 018f1234-5678-7000-8000-000000000005
                  companyId: 018f1234-5678-7000-8000-000000000004
                  code: SS
                  name: COMPAÑÍA  ÁGIL
                  siteType: BRANCH
                  status: DRAFT
                  version: 0
                  effectivelyOperational: false
                  createdAt: '2026-10-17T12:00:00.123456Z'
                  createdBy: Actor-aB
                  updatedAt: '2026-10-17T12:00:00.123456Z'
                  updatedBy: Actor-aB
        '400':
          description: site-code-required, site-code-too-long, site-name-required, site-name-too-long, site-type-null-not-allowed,
            site-type-not-supported, site-code-must-be-string, site-name-must-be-string, site-type-must-be-string,
            request-body-required, request-body-invalid-json, request-body-must-be-object, request-body-contains-unknown-fields,
            request-body-contains-duplicate-fields, company-id-invalid, site-id-invalid, idempotency-key-required,
            idempotency-key-duplicated, idempotency-key-blank, idempotency-key-too-long, query-parameter-not-supported,
            query-parameter-repeated, site-status-not-supported, site-page-limit-must-be-an-integer, site-page-limit-must-be-between-1-and-200,
            site-cursor-invalid-or-incompatible
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '404':
          description: company-not-found, site-not-found
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '409':
          description: site-code-already-exists, headquarters-already-exists, idempotency-key-already-used-with-different-request,
            site-registration-not-allowed-for-archived-company
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '500':
          description: Sanitized server-error
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '503':
          description: dependency-unavailable
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
    get:
      operationId: listCompanySites
      summary: List local Sites including CLOSED history
      description: Filters combine with AND. Forward created_at DESC/id DESC pagination over current data. No global
        count; parent ARCHIVED remains readable. Cursor binds tenant, Company, filters and order, excluding actor/process/limit.
      parameters:
      - *id008
      - *id009
      - *id010
      - *id011
      - name: code
        in: query
        schema:
          type: string
          minLength: 1
        description: Exact canonical code; strip/uppercase before enforcing 64 Unicode code points.
      - name: siteType
        in: query
        schema:
          type: string
          enum:
          - HEADQUARTERS
          - BRANCH
          - WAREHOUSE
          - OTHER
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          - CLOSED
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 4096
      responses:
        '200':
          description: Current local Site page; nextCursor only when more results exist.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteCollectionEnvelope'
              example:
                status: 200
                code: successful
                data:
                - siteId: 018f1234-5678-7000-8000-000000000005
                  companyId: 018f1234-5678-7000-8000-000000000004
                  code: SS
                  name: COMPAÑÍA  ÁGIL
                  siteType: BRANCH
                  status: DRAFT
                  version: 0
                  effectivelyOperational: false
                  createdAt: '2026-10-17T12:00:00.123456Z'
                  createdBy: Actor-aB
                  updatedAt: '2026-10-17T12:00:00.123456Z'
                  updatedBy: Actor-aB
                numberOfElements: 1
        '400':
          description: site-code-required, site-code-too-long, site-name-required, site-name-too-long, site-type-null-not-allowed,
            site-type-not-supported, site-code-must-be-string, site-name-must-be-string, site-type-must-be-string,
            request-body-required, request-body-invalid-json, request-body-must-be-object, request-body-contains-unknown-fields,
            request-body-contains-duplicate-fields, company-id-invalid, site-id-invalid, idempotency-key-required,
            idempotency-key-duplicated, idempotency-key-blank, idempotency-key-too-long, query-parameter-not-supported,
            query-parameter-repeated, site-status-not-supported, site-page-limit-must-be-an-integer, site-page-limit-must-be-between-1-and-200,
            site-cursor-invalid-or-incompatible
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '404':
          description: company-not-found, site-not-found
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '500':
          description: Sanitized server-error
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '503':
          description: dependency-unavailable
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
  /v1/companies/{companyId}/sites/{siteId}:
    patch:
      operationId: updateCompanySite
      summary: Update local Company Site
      description: If-Match is the original Site revision. Optional key identifies tenant/operation/key.
        Matching replay precedes current state and returns original audit/operativity
        with current Process-Id. Every new acceptance locks Company then Site; no-op is
        PATCH only. No provider or broker calls.
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ProcessId'
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/UpdateIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
            example:
              name: SEDE NORTE
      responses:
        '200':
          description: Accepted Site, including original historical replay.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteEnvelope'
        '400':
          description: Invalid context/path/key/body; if-match-required, if-match-duplicated,
            if-match-invalid. PATCH field and structural diagnostics use the Site catalog.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMutationErrorResponse'
        '404':
          description: company-not-found or site-not-found. Ownership precedes state.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMutationErrorResponse'
        '409':
          description: site-mutation-not-allowed-for-archived-company, site-closed, site-already-in-requested-state,
            site-transition-not-allowed, active-headquarters-required, headquarters-already-exists,
            site-code-already-exists, idempotency-key-already-used-with-different-request.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMutationErrorResponse'
        '412':
          description: aggregate-version-mismatch; checked before terminal states, including
            PATCH no-op.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMutationErrorResponse'
        '415':
          description: unsupported-media-type
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMutationErrorResponse'
        '500':
          description: Sanitized server-error, including unsupported/corrupt historical
            material.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMutationErrorResponse'
        '503':
          description: dependency-unavailable; unresolved result, no automatic write retry.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMutationErrorResponse'
    get:
      operationId: getCompanySite
      summary: Read current tenant and Company qualified Site
      description: CLOSED Sites and ARCHIVED Companies remain readable. Operational means Company ACTIVE and Site
        ACTIVE from the same local statement.
      parameters:
      - *id008
      - *id009
      - *id010
      - *id011
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current local Site.
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteEnvelope'
              example:
                status: 200
                code: successful
                data:
                  siteId: 018f1234-5678-7000-8000-000000000005
                  companyId: 018f1234-5678-7000-8000-000000000004
                  code: SS
                  name: COMPAÑÍA  ÁGIL
                  siteType: BRANCH
                  status: DRAFT
                  version: 0
                  effectivelyOperational: false
                  createdAt: '2026-10-17T12:00:00.123456Z'
                  createdBy: Actor-aB
                  updatedAt: '2026-10-17T12:00:00.123456Z'
                  updatedBy: Actor-aB
        '400':
          description: site-code-required, site-code-too-long, site-name-required, site-name-too-long, site-type-null-not-allowed,
            site-type-not-supported, site-code-must-be-string, site-name-must-be-string, site-type-must-be-string,
            request-body-required, request-body-invalid-json, request-body-must-be-object, request-body-contains-unknown-fields,
            request-body-contains-duplicate-fields, company-id-invalid, site-id-invalid, idempotency-key-required,
            idempotency-key-duplicated, idempotency-key-blank, idempotency-key-too-long, query-parameter-not-supported,
            query-parameter-repeated, site-status-not-supported, site-page-limit-must-be-an-integer, site-page-limit-must-be-between-1-and-200,
            site-cursor-invalid-or-incompatible
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '404':
          description: company-not-found, site-not-found
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '500':
          description: Sanitized server-error
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteErrorResponse'
        '503':
