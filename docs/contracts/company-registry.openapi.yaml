  responses:
    BadRequest:
      description: Invalid business input/context; status equals HTTP status. No internal messages.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownProperty:
              $ref: '#/components/examples/UnknownProperty'
            validation:
              $ref: '#/components/examples/ValidationFailure'
    ServerError:
      description: Sanitized unexpected failure without messages, stack traces, SQL or provider payloads.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unexpected:
              $ref: '#/components/examples/UnexpectedFailure'
    NotFound:
      description: Company absent in this tenant; identical for foreign IDs.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            code: not-found
    ReferenceNotFound:
      description: Party absent in this tenant on new registration.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            code: reference-not-found
    Conflict:
      description: Code/Party occupied or accepted key with different effective input.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            code: resource-conflict
    DependencyInvalid:
      description: Invalid upstream contract or persisted Party no longer resolvable.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 502
            code: dependency-response-invalid
    DependencyUnavailable:
      description: Provider unavailable, deadline exceeded or commit outcome still uncertain; retry the same key/input.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 503
            code: dependency-unavailable
    AggregateVersionMismatch:
      description: 'Expected Company version is stale: aggregate-version-mismatch.'
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Unsupported media type.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
