// Preserve final JVM, process and native results independently.
allprojects { project ->
    def run = project.providers.gradleProperty("hu08EvidenceRun").orElse("jvm").get()
    project.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { task ->
        task.systemProperty("quarkus.http.test-port", project.providers.gradleProperty("hu08HttpTestPort").orElse("8081").get())
        task.binaryResultsDirectory.set(project.layout.buildDirectory.dir("hu08-evidence/${run}/results/${task.name}/binary"))
        task.reports.junitXml.outputLocation.set(project.layout.buildDirectory.dir("hu08-evidence/${run}/results/${task.name}/xml"))
        task.reports.html.outputLocation.set(project.layout.buildDirectory.dir("hu08-evidence/${run}/results/${task.name}/html"))
    }
}
