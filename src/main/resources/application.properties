quarkus.application.name=company-registry-service
quarkus.http.port=8083
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=18
quarkus.datasource.devservices.enabled=false
# JDBC is a migration-only island; no JTA or operational JDBC repositories.
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=2
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.cache-prepared-statements=true
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.flyway.username=${FLYWAY_DB_USERNAME}
quarkus.flyway.password=${FLYWAY_DB_PASSWORD}
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.validate-migration-naming=true
quarkus.flyway.clean-disabled=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.jackson.fail-on-unknown-properties=true
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper
api-response.errors.http-failure-handler.enabled=true
api-response.errors.http-failure-handler.path=/v1/*
mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=openapi
quarkus.rest-client.party-registry.url=${PARTY_REGISTRY_BASE_URL:http://localhost:8082}
quarkus.rest-client.party-registry.connect-timeout=${PARTY_REGISTRY_CONNECT_TIMEOUT_MS:2500}
quarkus.rest-client.party-registry.read-timeout=${PARTY_REGISTRY_READ_TIMEOUT_MS:5000}
quarkus.rest-client.party-registry.disable-default-mapper=true
quarkus.rest-client.geographic-reference.url=${GEOGRAPHIC_REFERENCE_BASE_URL:http://localhost:8081}
quarkus.rest-client.geographic-reference.connect-timeout=${GEOGRAPHIC_REFERENCE_CONNECT_TIMEOUT_MS:2000}
quarkus.rest-client.geographic-reference.read-timeout=${GEOGRAPHIC_REFERENCE_READ_TIMEOUT_MS:5000}
quarkus.rest-client.geographic-reference.disable-default-mapper=true
company-registry.outbox.mode=${COMPANY_OUTBOX_MODE:disabled}
# No production key defaults. Historical IDs must retain their original secrets.
company-registry.idempotency.active-key-id=${COMPANY_IDEMPOTENCY_ACTIVE_KEY_ID}
# Disposable test material only; external processes use the test profile explicitly.
%test.company-registry.idempotency.active-key-id=test-k1
%test.company-registry.idempotency.keys.test-k1=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
company-registry.outbox.publisher.poll-interval=${COMPANY_OUTBOX_POLL_INTERVAL:5s}
company-registry.outbox.publisher.batch-size=${COMPANY_OUTBOX_BATCH_SIZE:25}
company-registry.outbox.publisher.publish-timeout=${COMPANY_OUTBOX_PUBLISH_TIMEOUT:5s}
company-registry.outbox.publisher.claim-lease=${COMPANY_OUTBOX_CLAIM_LEASE:30s}
company-registry.outbox.publisher.initial-backoff=${COMPANY_OUTBOX_INITIAL_BACKOFF:1s}
company-registry.outbox.publisher.maximum-backoff=${COMPANY_OUTBOX_MAXIMUM_BACKOFF:5m}
company-registry.outbox.publisher.maximum-attempts=${COMPANY_OUTBOX_MAXIMUM_ATTEMPTS:10}
company-registry.outbox.publisher.exchange=${COMPANY_OUTBOX_EXCHANGE:company.events}
company-registry.outbox.publisher.routing-key=${COMPANY_OUTBOX_ROUTING_KEY:company.events}
# No RabbitMQ connector/channels are installed, so no broker Dev Service can start.
# Pure numbering-plan metadata, needed when contact policies execute in native images.
quarkus.native.resources.includes=com/google/i18n/phonenumbers/data/**,META-INF/contracts/events/**
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
quarkus.native.container-runtime=podman
quarkus.native.additional-build-args=--initialize-at-run-time=com.alexastudillo.companyregistry.infrastructure.persistence.UuidV7Generator

# Local bootstrap creates these separate roles; production requires explicit variables above.
%dev.quarkus.datasource.username=${DB_USERNAME:company_registry_runtime}
%dev.quarkus.datasource.password=${DB_PASSWORD:company_registry_local}
%dev.quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:15432/company_registry_service}
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:15432/company_registry_service}
%dev.quarkus.flyway.username=${FLYWAY_DB_USERNAME:company_registry_migration}
%dev.quarkus.flyway.password=${FLYWAY_DB_PASSWORD:company_registry_local}

company-registry.update.wait-budget=${COMPANY_UPDATE_WAIT_BUDGET:10s}
company-registry.site-registration.wait-budget=${COMPANY_SITE_REGISTRATION_WAIT_BUDGET:10s}

company-registry.site-mutation.wait-budget=${COMPANY_SITE_MUTATION_WAIT_BUDGET:10s}
company-registry.lifecycle.wait-budget=${COMPANY_LIFECYCLE_WAIT_BUDGET:10s}
